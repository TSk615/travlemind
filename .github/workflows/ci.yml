name: CI

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A shallow root makes diff-tree check every historical file instead of this change.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check changed lines for whitespace errors
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
            git diff --check "origin/$GITHUB_BASE_REF...HEAD"
          else
            git diff-tree --check --no-commit-id --root -r HEAD
          fi
      - name: Compile Python sources and tests
        run: python -m compileall -q apps/api/src apps/api/tests apps/worker/src

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run test:web:unit
      - run: npm run build:web

  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web:e2e

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: travelmind_test
          POSTGRES_USER: travelmind
          POSTGRES_PASSWORD: travelmind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U travelmind -d travelmind_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TRAVELMIND_TEST_POSTGRES_URL: postgresql+psycopg://travelmind:travelmind@127.0.0.1:5432/travelmind_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python 3.11 --frozen --project apps/api
      - run: uv run --project apps/api pytest apps/api/tests

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python 3.11 --frozen --project apps/worker
      - run: uv run --project apps/worker python -m unittest discover -s apps/worker/tests -v

  search-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python 3.11 --frozen --project apps/groksearch-bridge
      - run: uv run --project apps/groksearch-bridge pytest apps/groksearch-bridge/tests

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg VITE_API_BASE_URL=http://localhost:8000 --file apps/web/Dockerfile --tag travelmind-web .
      - run: docker build --file apps/api/Dockerfile --tag travelmind-api .
      - run: docker build --file apps/worker/Dockerfile --tag travelmind-worker .
      - run: docker compose --env-file infra/.env.example --file infra/docker-compose.yml config


