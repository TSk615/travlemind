user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log off;
    sendfile on;
    client_max_body_size 32m;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    map $http_x_forwarded_proto $forwarded_proto { default $scheme; https https; }
    server {
        listen 127.0.0.1:18080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        location / { try_files $uri $uri/ /index.html; }
        location ~ ^/(api/|exports/|images/|health$|openapi\.json$|docs$) {
            # Cloudflare otherwise caches PDF/image extensions even when the
            # origin required a session cookie. Never cache private responses.
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            add_header Cache-Control "private, no-store" always;
            proxy_pass http://127.0.0.1:18000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
            proxy_buffering off;
        }
    }
}
