services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-travelmind}
      POSTGRES_USER: ${POSTGRES_USER:-travelmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-travelmind}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-travelmind} -d ${POSTGRES_DB:-travelmind}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL:-}
        PIP_DEFAULT_TIMEOUT: ${PIP_DEFAULT_TIMEOUT:-120}
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      TRAVELMIND_ENVIRONMENT: ${TRAVELMIND_ENVIRONMENT:-development}
      TRAVELMIND_DATABASE_URL: ${TRAVELMIND_COMPOSE_DATABASE_URL:-postgresql+psycopg://travelmind:travelmind@postgres:5432/travelmind}
      TRAVELMIND_WORKFLOW_CHECKPOINT_URL: ${TRAVELMIND_COMPOSE_WORKFLOW_CHECKPOINT_URL:-postgresql://travelmind:travelmind@postgres:5432/travelmind}
      TRAVELMIND_EXPORT_ROOT: /app/storage/exports
      TRAVELMIND_JWT_SECRET: ${TRAVELMIND_JWT_SECRET:-travelmind-dev-secret-change-me-32-bytes-minimum}
      TRAVELMIND_CREDENTIAL_ENCRYPTION_KEY: ${TRAVELMIND_CREDENTIAL_ENCRYPTION_KEY:-travelmind-dev-credential-key-change-me-32-bytes}
      TRAVELMIND_COOKIE_SECURE: ${TRAVELMIND_COOKIE_SECURE:-false}
      TRAVELMIND_COOKIE_SAMESITE: ${TRAVELMIND_COOKIE_SAMESITE:-lax}
      TRAVELMIND_CSRF_ENABLED: ${TRAVELMIND_CSRF_ENABLED:-true}
      TRAVELMIND_RATE_LIMIT_ENABLED: ${TRAVELMIND_RATE_LIMIT_ENABLED:-true}
      TRAVELMIND_RATE_LIMIT_BACKEND: ${TRAVELMIND_RATE_LIMIT_BACKEND:-redis}
      TRAVELMIND_JOB_MAX_ATTEMPTS: ${TRAVELMIND_JOB_MAX_ATTEMPTS:-3}
      TRAVELMIND_JOB_TIMEOUT_SECONDS: ${TRAVELMIND_JOB_TIMEOUT_SECONDS:-900}
      TRAVELMIND_JOB_RETRY_BASE_SECONDS: ${TRAVELMIND_JOB_RETRY_BASE_SECONDS:-5}
      TRAVELMIND_JOB_HEARTBEAT_SECONDS: ${TRAVELMIND_JOB_HEARTBEAT_SECONDS:-15}
      TRAVELMIND_JOB_STALE_AFTER_SECONDS: ${TRAVELMIND_JOB_STALE_AFTER_SECONDS:-120}
      TRAVELMIND_JOB_RESULT_TTL_SECONDS: ${TRAVELMIND_JOB_RESULT_TTL_SECONDS:-86400}
      TRAVELMIND_QUEUE_MODE: arq
      TRAVELMIND_REDIS_URL: redis://redis:6379/0
      TRAVELMIND_AGENT_PROVIDER: ${TRAVELMIND_AGENT_PROVIDER:-stub}
      TRAVELMIND_PUBLIC_API_URL: ${TRAVELMIND_PUBLIC_API_URL:-http://localhost:8000}
      TRAVELMIND_CORS_ORIGINS: >-
        ${TRAVELMIND_CORS_ORIGINS:-["http://127.0.0.1:5173","http://localhost:5173","http://127.0.0.1:3000","http://localhost:3000"]}
      TRAVELMIND_UPSTREAM_PRIVATE_URL_POLICY: ${TRAVELMIND_UPSTREAM_PRIVATE_URL_POLICY:-loopback}
      TRAVELMIND_UPSTREAM_URL_ALLOWED_HOSTS: ${TRAVELMIND_UPSTREAM_URL_ALLOWED_HOSTS:-groksearch-bridge,host.docker.internal}
      TRAVELMIND_SEARCH_SERVICE_PROVIDER: ${TRAVELMIND_SEARCH_SERVICE_PROVIDER:-groksearch}
      TRAVELMIND_SEARCH_SERVICE_TRANSPORT: ${TRAVELMIND_SEARCH_SERVICE_TRANSPORT:-mcp}
      TRAVELMIND_GROKSEARCH_BRIDGE_BASE_URL: ${TRAVELMIND_GROKSEARCH_BRIDGE_BASE_URL:-http://groksearch-bridge:8085/mcp}
      TRAVELMIND_GROKSEARCH_BRIDGE_API_KEY: ${TRAVELMIND_GROKSEARCH_BRIDGE_API_KEY:-travelmind-groksearch-dev-key}
      TRAVELMIND_GROKSEARCH_BRIDGE_TIMEOUT_SECONDS: ${TRAVELMIND_GROKSEARCH_BRIDGE_TIMEOUT_SECONDS:-30}
      TRAVELMIND_XHS_CRAWLER_ENABLED: ${TRAVELMIND_XHS_CRAWLER_ENABLED:-false}
      TRAVELMIND_XHS_CRAWLER_BASE_URL: ${TRAVELMIND_XHS_CRAWLER_BASE_URL:-http://xhs-crawler:8090}
      TRAVELMIND_XHS_CRAWLER_API_KEY: ${TRAVELMIND_XHS_CRAWLER_API_KEY:-}
      TRAVELMIND_XHS_CRAWLER_TIMEOUT_SECONDS: ${TRAVELMIND_XHS_CRAWLER_TIMEOUT_SECONDS:-20}
      TRAVELMIND_XHS_CACHE_TTL_SECONDS: ${TRAVELMIND_XHS_CACHE_TTL_SECONDS:-1800}
      TRAVELMIND_XHS_LIMIT_PER_QUERY: ${TRAVELMIND_XHS_LIMIT_PER_QUERY:-5}
      TRAVELMIND_XHS_MAX_RESULTS: ${TRAVELMIND_XHS_MAX_RESULTS:-10}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - storage-data:/app/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL:-}
        PIP_DEFAULT_TIMEOUT: ${PIP_DEFAULT_TIMEOUT:-120}
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      TRAVELMIND_ENVIRONMENT: ${TRAVELMIND_ENVIRONMENT:-development}
      TRAVELMIND_DATABASE_URL: ${TRAVELMIND_COMPOSE_DATABASE_URL:-postgresql+psycopg://travelmind:travelmind@postgres:5432/travelmind}
      TRAVELMIND_WORKFLOW_CHECKPOINT_URL: ${TRAVELMIND_COMPOSE_WORKFLOW_CHECKPOINT_URL:-postgresql://travelmind:travelmind@postgres:5432/travelmind}
      TRAVELMIND_EXPORT_ROOT: /app/storage/exports
      TRAVELMIND_JWT_SECRET: ${TRAVELMIND_JWT_SECRET:-travelmind-dev-secret-change-me-32-bytes-minimum}
      TRAVELMIND_CREDENTIAL_ENCRYPTION_KEY: ${TRAVELMIND_CREDENTIAL_ENCRYPTION_KEY:-travelmind-dev-credential-key-change-me-32-bytes}
      TRAVELMIND_JOB_MAX_ATTEMPTS: ${TRAVELMIND_JOB_MAX_ATTEMPTS:-3}
      TRAVELMIND_JOB_TIMEOUT_SECONDS: ${TRAVELMIND_JOB_TIMEOUT_SECONDS:-900}
      TRAVELMIND_JOB_RETRY_BASE_SECONDS: ${TRAVELMIND_JOB_RETRY_BASE_SECONDS:-5}
      TRAVELMIND_JOB_HEARTBEAT_SECONDS: ${TRAVELMIND_JOB_HEARTBEAT_SECONDS:-15}
      TRAVELMIND_JOB_STALE_AFTER_SECONDS: ${TRAVELMIND_JOB_STALE_AFTER_SECONDS:-120}
      TRAVELMIND_JOB_RESULT_TTL_SECONDS: ${TRAVELMIND_JOB_RESULT_TTL_SECONDS:-86400}
      TRAVELMIND_WORKER_MAX_JOBS: ${TRAVELMIND_WORKER_MAX_JOBS:-8}
      TRAVELMIND_QUEUE_MODE: arq
      TRAVELMIND_REDIS_URL: redis://redis:6379/0
      TRAVELMIND_AGENT_PROVIDER: ${TRAVELMIND_AGENT_PROVIDER:-stub}
      TRAVELMIND_PUBLIC_API_URL: ${TRAVELMIND_PUBLIC_API_URL:-http://localhost:8000}
      TRAVELMIND_CORS_ORIGINS: >-
        ${TRAVELMIND_CORS_ORIGINS:-["http://127.0.0.1:5173","http://localhost:5173","http://127.0.0.1:3000","http://localhost:3000"]}
      TRAVELMIND_UPSTREAM_PRIVATE_URL_POLICY: ${TRAVELMIND_UPSTREAM_PRIVATE_URL_POLICY:-loopback}
      TRAVELMIND_UPSTREAM_URL_ALLOWED_HOSTS: ${TRAVELMIND_UPSTREAM_URL_ALLOWED_HOSTS:-groksearch-bridge,host.docker.internal}
      TRAVELMIND_SEARCH_SERVICE_PROVIDER: ${TRAVELMIND_SEARCH_SERVICE_PROVIDER:-groksearch}
      TRAVELMIND_SEARCH_SERVICE_TRANSPORT: ${TRAVELMIND_SEARCH_SERVICE_TRANSPORT:-mcp}
      TRAVELMIND_GROKSEARCH_BRIDGE_BASE_URL: ${TRAVELMIND_GROKSEARCH_BRIDGE_BASE_URL:-http://groksearch-bridge:8085/mcp}
      TRAVELMIND_GROKSEARCH_BRIDGE_API_KEY: ${TRAVELMIND_GROKSEARCH_BRIDGE_API_KEY:-travelmind-groksearch-dev-key}
      TRAVELMIND_GROKSEARCH_BRIDGE_TIMEOUT_SECONDS: ${TRAVELMIND_GROKSEARCH_BRIDGE_TIMEOUT_SECONDS:-30}
      TRAVELMIND_XHS_CRAWLER_ENABLED: ${TRAVELMIND_XHS_CRAWLER_ENABLED:-false}
      TRAVELMIND_XHS_CRAWLER_BASE_URL: ${TRAVELMIND_XHS_CRAWLER_BASE_URL:-http://xhs-crawler:8090}
      TRAVELMIND_XHS_CRAWLER_API_KEY: ${TRAVELMIND_XHS_CRAWLER_API_KEY:-}
      TRAVELMIND_XHS_CRAWLER_TIMEOUT_SECONDS: ${TRAVELMIND_XHS_CRAWLER_TIMEOUT_SECONDS:-20}
      TRAVELMIND_XHS_CACHE_TTL_SECONDS: ${TRAVELMIND_XHS_CACHE_TTL_SECONDS:-1800}
      TRAVELMIND_XHS_LIMIT_PER_QUERY: ${TRAVELMIND_XHS_LIMIT_PER_QUERY:-5}
      TRAVELMIND_XHS_MAX_RESULTS: ${TRAVELMIND_XHS_MAX_RESULTS:-10}
    volumes:
      - storage-data:/app/storage
    restart: unless-stopped
    stop_grace_period: 30s

  xhs-crawler:
    profiles: ["xhs"]
    build:
      context: ..
      dockerfile: apps/xhs-crawler/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL:-}
        PIP_DEFAULT_TIMEOUT: ${PIP_DEFAULT_TIMEOUT:-120}
    environment:
      TRAVELMIND_XHS_DATA_ROOT: /app/data
      TRAVELMIND_XHS_NODE_BINARY: ${TRAVELMIND_XHS_NODE_BINARY:-node}
      TRAVELMIND_XHS_OPENCLI_BINARY: ${TRAVELMIND_XHS_OPENCLI_BINARY:-opencli}
      TRAVELMIND_XHS_OPENCLI_TIMEOUT_SECONDS: ${TRAVELMIND_XHS_OPENCLI_TIMEOUT_SECONDS:-45}
    ports:
      - "${XHS_CRAWLER_PORT:-8090}:8090"
    volumes:
      - xhs-crawler-data:/app/data

  groksearch-bridge:
    build:
      context: ..
      dockerfile: apps/groksearch-bridge/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL:-}
        PIP_DEFAULT_TIMEOUT: ${PIP_DEFAULT_TIMEOUT:-120}
        GROKSEARCH_GIT_URL: ${GROKSEARCH_GIT_URL:-https://github.com/GuDaStudio/GrokSearch}
        GROKSEARCH_REF: ${GROKSEARCH_REF:-grok-with-tavily}
    environment:
      TRAVELMIND_GROKSEARCH_BRIDGE_API_KEY: ${TRAVELMIND_GROKSEARCH_BRIDGE_API_KEY:-travelmind-groksearch-dev-key}
      TRAVELMIND_GROKSEARCH_COMMAND: ${TRAVELMIND_GROKSEARCH_COMMAND:-grok-search}
      GUDA_BASE_URL: ${GUDA_BASE_URL:-https://code.guda.studio}
      GUDA_API_KEY: ${GUDA_API_KEY:-}
      GROK_API_URL: ${GROK_API_URL:-}
      GROK_API_KEY: ${GROK_API_KEY:-}
      GROK_MODEL: ${GROK_MODEL:-Web/grok-chat-fast}
      GROK_WIRE_API: ${GROK_WIRE_API:-chat_completions}
      TAVILY_ENABLED: ${TAVILY_ENABLED:-true}
      TAVILY_API_URL: ${TAVILY_API_URL:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      FIRECRAWL_API_URL: ${FIRECRAWL_API_URL:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      GROK_DEBUG: ${GROK_DEBUG:-false}
      GROK_LOG_LEVEL: ${GROK_LOG_LEVEL:-INFO}
    ports:
      - "${GROKSEARCH_BRIDGE_PORT:-8085}:8085"

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:80"

volumes:
  redis-data:
  postgres-data:
  storage-data:
  xhs-crawler-data:
