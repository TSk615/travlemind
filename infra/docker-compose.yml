services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"

  postgres:
    profiles: ["postgres"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-travelmind}
      POSTGRES_USER: ${POSTGRES_USER:-travelmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-travelmind}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    depends_on:
      - redis
    environment:
      TRAVELMIND_DATABASE_URL: sqlite:////app/storage/travelmind.db
      TRAVELMIND_EXPORT_ROOT: /app/storage/exports
      TRAVELMIND_JWT_SECRET: ${TRAVELMIND_JWT_SECRET:-travelmind-dev-secret}
      TRAVELMIND_QUEUE_MODE: arq
      TRAVELMIND_REDIS_URL: redis://redis:6379/0
      TRAVELMIND_AGENT_PROVIDER: ${TRAVELMIND_AGENT_PROVIDER:-stub}
      TRAVELMIND_PUBLIC_API_URL: ${TRAVELMIND_PUBLIC_API_URL:-http://localhost:8000}
      TRAVELMIND_CORS_ORIGINS: >-
        ${TRAVELMIND_CORS_ORIGINS:-["http://127.0.0.1:5173","http://localhost:5173","http://127.0.0.1:3000","http://localhost:3000"]}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - storage-data:/app/storage

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    depends_on:
      - redis
    environment:
      TRAVELMIND_DATABASE_URL: sqlite:////app/storage/travelmind.db
      TRAVELMIND_EXPORT_ROOT: /app/storage/exports
      TRAVELMIND_JWT_SECRET: ${TRAVELMIND_JWT_SECRET:-travelmind-dev-secret}
      TRAVELMIND_QUEUE_MODE: arq
      TRAVELMIND_REDIS_URL: redis://redis:6379/0
      TRAVELMIND_AGENT_PROVIDER: ${TRAVELMIND_AGENT_PROVIDER:-stub}
      TRAVELMIND_PUBLIC_API_URL: ${TRAVELMIND_PUBLIC_API_URL:-http://localhost:8000}
      TRAVELMIND_CORS_ORIGINS: >-
        ${TRAVELMIND_CORS_ORIGINS:-["http://127.0.0.1:5173","http://localhost:5173","http://127.0.0.1:3000","http://localhost:3000"]}
    volumes:
      - storage-data:/app/storage

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:80"

volumes:
  postgres-data:
  storage-data:
