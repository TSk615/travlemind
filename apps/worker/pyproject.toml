[project]
name = "travelmind-worker"
version = "0.1.0"
description = "TravelMind AI background worker"
requires-python = ">=3.10"
dependencies = [
  "arq>=0.26.3,<1.0.0",
  "travelmind-api"
]

[tool.uv.sources]
travelmind-api = { path = "../api", editable = true }

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
