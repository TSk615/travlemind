[project]
name = "travelmind-api"
version = "0.1.0"
description = "TravelMind AI FastAPI backend"
requires-python = ">=3.10"
dependencies = [
  "opencc-python-reimplemented>=0.1.7,<0.2",
  "pillow>=11.0,<13",
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn>=0.34.0,<1.0.0",
  "sqlalchemy>=2.0.36,<3.0.0",
  "alembic>=1.14.0,<2.0.0",
  "psycopg[binary]>=3.2.0,<4.0.0",
  "pydantic-settings>=2.7.0,<3.0.0",
  "cryptography>=45.0.0,<47.0.0",
  "pyjwt>=2.10.1,<3.0.0",
  "arq>=0.26.3,<1.0.0",
  "redis>=5.2.0,<6.0.0",
  "httpx>=0.28.1,<1.0.0",
  "python-multipart>=0.0.20,<1.0.0",
  "hello-agents>=1.0.0,<2.0.0",
  "reportlab>=4.4.0,<5.0.0",
  "pypdf>=5.4.0,<6.0.0",
  "langgraph>=1.2.0,<2.0.0",
  "langgraph-checkpoint-sqlite>=3.1.1,<4.0.0",
  "langgraph-checkpoint-postgres>=3.1.2,<4.0.0",
]

[dependency-groups]
dev = ["pytest>=8.3.5,<9.0.0"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "../../storage/.pytest_cache"
